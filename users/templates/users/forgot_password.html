{% extends 'base.html' %}
{% load static %}

{% block title %}
Forgot Password | {{ site_name }}
{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="Background pattern">
  </div>

  <div class="auth-form-container">
    <div class="auth-container auth-container--forgot-password">
      <div class="Legend">
        <h1 class="auth-title">Forgot Password</h1>
        <p style="color: var(--grey-text); margin-top: 0.5rem;">Enter your email to reset password</p>
      </div>
    
      <form method="post" class="auth-form">
        {% csrf_token %}
        
        <div class="InputField">
          <label for="id_email">Email</label>
          <input type="email" name="email" id="id_email" class="Input" placeholder="your@email.com" required>
        </div>
        
        <div class="ButtonGroup ButtonGroup--center">
          <button type="submit" class="button button--primary">Send Reset Link</button>
          <a href="{% url 'users:login' %}" class="button button--cancel">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
