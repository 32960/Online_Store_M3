{% extends 'base.html' %}
{% load static %}

{% block title %}
Password Reset Sent | {{ site_name }}
{% endblock %}

{% block content %}
<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="Background pattern">
  </div>

  <div class="auth-form-container">
    <div class="auth-container auth-container--forgot-password">
      <div class="Legend">
        <h1 class="auth-title">Check Your Email</h1>
        <p style="color: var(--grey-text); margin-top: 0.5rem;">
          We've sent you an email with instructions to reset your password.
        </p>
      </div>
      
      <div class="ButtonGroup ButtonGroup--center">
        <a href="{% url 'users:login' %}" class="button button--primary">Back to Login</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
